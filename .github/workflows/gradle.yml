name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start application
        run: java -jar ./artifacts/app-replan-delivery.jar &

      - name: Run tests
        run: ./gradlew test -Dselenide.headless=true